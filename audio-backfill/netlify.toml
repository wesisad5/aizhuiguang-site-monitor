# audio-backfill netlify site (S12) — builds from the PUBLIC GitLab mirror of
# this repo (ansgareutychisO/aizhuiguang-site-monitor), lane branch
# lane/aizg-backfill (0-credit branch deploys per the aigc-netlify-runner
# harness rules: never the default branch).
# State lives in the private scrape repo (git IS the disk — the runner
# recomputes the missing set from the GitHub tree every build).
# Self-chains via POST /sites/{NETLIFY_SITE_ID}/builds {"branch": BRANCH}.
[build]
  command = "mkdir -p pub && python3 backfill.py"
  publish = "pub"

[build.environment]
  PYTHONUNBUFFERED = "true"
  NODE_VERSION = "20"
