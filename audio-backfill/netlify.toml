# audio-backfill netlify site (S12) — site base dir = audio-backfill/
# Build compute for downloading missing aizhuiguang audio binaries into the
# private scrape repo (wesisad5/aizhuiguang-scrape) via git fast-import.
# Self-chaining: plugins/chain-trigger POSTs BUILD_HOOK_URL unless complete
# or the CHAIN kill switch (this repo) is off.
[build]
  command = "mkdir -p pub && python3 backfill.py"
  publish = "pub"

[[plugins]]
  package = "./plugins/chain-trigger"

[build.environment]
  PYTHONUNBUFFERED = "true"
  NODE_VERSION = "20"
