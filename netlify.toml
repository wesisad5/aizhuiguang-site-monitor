# aizg weekly monitor — netlify build lane (S12 alerting).
#
# This site is Git-connected to the PUBLIC monitor repo, LANE BRANCH ONLY
# (never the default branch — branch deploys stay 0-credit). The weekly
# trigger is the scheduled function on the same site (functions/weekly.mjs,
# cron Mon 09:00 UTC) which POSTs /sites/{id}/builds {"branch":"lane/monitor"}.
#
# Build: python3 site scan → on drift, open/update the GitHub drift issue
# (that emails the repo owner) + fail the build (netlify deploy notification).
[build]
  command = "bash monitor/netlify_run.sh"
  publish = "pub"

# S14: NO [functions] block on purpose — build lanes are pure scan sites.
# Scheduled functions living on a build-connected site get wiped/re-registered
# by every deploy (and build-stage schedule registration exits 2 on this plan).
# The weekly cron fn lives on aizg-vault (no git connection, no builds —
# immortal fn set; deployed via the raw API with function_schedules; see
# netlify-ops/README.md "Cron hub").

[build.environment]
  PYTHONUNBUFFERED = "true"
  NODE_VERSION = "20"
